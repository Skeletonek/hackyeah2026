<h2>Potwierdź swój adres e-mail</h2>
<p>Kliknij przycisk, żeby połączyć adres {{ .NewEmail }} ze swoim kontem w Splocie. Twoje zgłoszenia zostaną na koncie.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change">Potwierdzam adres</a></p>
<p>Jeśli to nie Ty, zignoruj tę wiadomość.</p>
